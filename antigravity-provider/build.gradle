dependencies {
    // Every first-party coordinate is compileOnly: the host's ProviderRegistry classloader already
    // carries these classes, so the shipped provider jar must not bundle a second copy. A
    // release-asset jar exports nothing transitively, so each classifier a source imports from is
    // named here, and named again as githubTestImplementation because compileOnly does not reach
    // the test compile classpath.
    githubCompileOnly "intisy-ai:core-auth:1.4.0:auth-contracts"
    githubCompileOnly "intisy-ai:core-auth:1.4.0:accounts"
    githubCompileOnly "intisy-ai:api:1.2.0:contract"
    githubCompileOnly "intisy-ai:api:1.2.0:seam"
    githubCompileOnly "intisy-ai:api:1.2.0:jvm-seam"
    // ModelsCache, the cached model catalogue AntigravityHostSeams reads and writes. It lives in
    // core-proxy's routing module today, which is why a provider names a routing coordinate at all.
    githubCompileOnly "intisy-ai:core-proxy:2.0.1:routing"
    githubCompileOnly "intisy-ai:core-ir:1.3.0:ir"
    githubCompileOnly "intisy-ai:gemini-translator:1.1.0:gemini"

    githubTestImplementation "intisy-ai:core-auth:1.4.0:auth-contracts"
    githubTestImplementation "intisy-ai:core-auth:1.4.0:accounts"
    githubTestImplementation "intisy-ai:api:1.2.0:contract"
    githubTestImplementation "intisy-ai:api:1.2.0:seam"
    githubTestImplementation "intisy-ai:api:1.2.0:jvm-seam"
    githubTestImplementation "intisy-ai:core-proxy:2.0.1:routing"
    githubTestImplementation "intisy-ai:core-ir:1.3.0:ir"
    githubTestImplementation "intisy-ai:gemini-translator:1.1.0:gemini"
    // GsonJsonCodec's own dependency, which a release-asset jar does not carry with it. Test-only:
    // at run time the host that loads this provider supplies gson, as it supplies the codec.
    testImplementation "com.google.code.gson:gson:2.10.1"
}

// Keep the jar filename version-less (antigravity-provider.jar) even though project.version is
// set (for publishGithub's package version): publishGithub's artifacts block below references
// build/libs/antigravity-provider.jar by that exact name, and the uploaded asset is renamed to
// antigravity-auth-provider.jar from `repo` + classifier anyway.
jar {
    archiveVersion = ""
}

publishGithub {
    // :antigravity-provider is a subdirectory of antigravity-auth's own repo with no .git of its
    // own inside java/antigravity-provider, so publishGithub's default git-remote lookup fails.
    // Set owner/repo explicitly; these also drive the uploaded asset name:
    // antigravity-auth-provider.jar (from `repo` + classifier), which is what ai-java's
    // GithubOrgProviderSource scanner matches.
    owner = "intisy-ai"
    repo = "antigravity-auth"
    releaseName = "Antigravity provider ${project.findProperty('artifact_version') ?: project.version}"
    artifacts {
        artifact {
            classifier = "provider"
            jar = file("build/libs/antigravity-provider.jar")
        }
    }
}
