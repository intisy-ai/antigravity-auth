dependencies {
    // The pure-logic classes only need the JsonCodec/Clock/Random SPIs
    // (io.github.intisy.ai.shared.spi.*). AntigravityProvider implements the host-provided
    // Provider/ProxyHandler SPI, the same "keep the shipped jar thin" discipline stub-provider/
    // echo-provider use: compileOnly keeps :routing's classes (Provider/HandlerCtx/HttpRequest/
    // HttpResponse) out of this module's own built jar (the host's ProviderRegistry classloader
    // already has them); testImplementation re-adds it so test code can construct SPI-typed
    // references too.
    compileOnly project(":auth-contracts")
    compileOnly project(":seam")
    testImplementation project(":auth-contracts")

    // core-ir's IR types only (no vendor translators): AntigravityIrBridge round-trips the
    // Anthropic<->Gemini request format through the IR. Same "keep the shipped jar thin" discipline
    // as :routing above; ai-java does not host core-ir yet, so compileOnly keeps :ir's classes out
    // of antigravity-provider.jar; testImplementation re-adds it for test code.
    compileOnly project(":ir")
    testImplementation project(":ir")

    // gemini-translator's GeminiTranslator, used by AntigravityGeminiSseBridge/AntigravityIrBridge
    // to decode upstream Gemini responses to IR. Same thin-jar treatment as :ir above.
    compileOnly project(":gemini")
    testImplementation project(":gemini")

    // AntigravityBackend self-assembles Store/HttpClient/JsonCodec/Clock/Random + a real
    // AccountManager from the JVM backends + shared.select.QuotaHealth. ai-java is consumed from
    // GitHub Packages Maven (java/build.gradle's repositories block) as a single fat jar
    // (:routing + :accounts + :jvm shaded together), so one coordinate covers everything
    // AntigravityBackend and AntigravityQuotaParser.accountHasQuota (QuotaHealth) need.
    // compileOnly (not implementation) keeps this module's own jar THIN: the host's
    // ProviderRegistry classloader already has these classes on its classpath.
    compileOnly "io.github.intisy:ai-java:1.0.9"
    // Local dev/test only: the composite includeBuild (settings.gradle) substitutes this
    // io.github.intisy:jvm coordinate for the real :jvm project, transitively pulling in :accounts.
    // Tests are skipped in CI (-x test -x compileTestJava) so this never needs to resolve there.
    testImplementation "io.github.intisy:jvm:0.1.0"
}

// Keep the jar filename version-less (antigravity-provider.jar) even though project.version is
// set (for publishGithub's package version): publishGithub's artifacts block below references
// build/libs/antigravity-provider.jar by that exact name, and the uploaded asset is renamed to
// antigravity-auth-provider.jar from `repo` + classifier anyway.
jar {
    archiveVersion = ""
}

publishGithub {
    // :antigravity-provider is a subdirectory of antigravity-auth's own repo with no .git of its
    // own inside java/antigravity-provider, so publishGithub's default git-remote lookup fails.
    // Set owner/repo explicitly; these also drive the uploaded asset name:
    // antigravity-auth-provider.jar (from `repo` + classifier), which is what ai-java's
    // GithubOrgProviderSource scanner matches.
    owner = "intisy-ai"
    repo = "antigravity-auth"
    releaseName = "Antigravity provider ${project.findProperty('artifact_version') ?: project.version}"
    artifacts {
        artifact {
            classifier = "provider"
            jar = file("build/libs/antigravity-provider.jar")
        }
    }
}
