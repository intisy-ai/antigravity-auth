dependencies {
    // T7a's pure-logic classes only need the JsonCodec/Clock/Random SPIs
    // (io.github.intisy.ai.shared.spi.*). AntigravityProvider implements the host-provided
    // Provider/ProxyHandler SPI -- same "keep the shipped jar thin" discipline stub-provider/
    // echo-provider use: compileOnly keeps :routing's classes (Provider/HandlerCtx/HttpRequest/
    // HttpResponse) out of this module's own built jar (the host's ProviderRegistry classloader
    // already has them); testImplementation re-adds it so test code can construct SPI-typed
    // references too.
    compileOnly project(":routing")
    testImplementation project(":routing")

    // Phase 2: AntigravityBackend self-assembles Store/HttpClient/JsonCodec/Clock/Random + a real
    // AccountManager from the JVM backends + :accounts (io.github.intisy:jvm's `api` dependencies
    // come along transitively -- no separate :accounts coordinate needed, mirrors stub-provider's
    // own testImplementation comment). compileOnly (not implementation) keeps this module's own
    // jar THIN: the host's ProviderRegistry classloader already has :jvm on its classpath.
    // Resolved via the test-only composite build below (includeBuild(aiJavaDir)) substituting
    // this group:module coordinate for the real :jvm project.
    compileOnly "io.github.intisy:jvm:0.1.0"
    testImplementation "io.github.intisy:jvm:0.1.0"
}

// Keep the jar filename version-less (antigravity-provider.jar) even though project.version is
// now set (for publishGithub's package version) -- publishGithub's artifacts block below
// references build/libs/antigravity-provider.jar by that exact name, and the uploaded asset is
// renamed to antigravity-auth-provider.jar from `repo` + classifier anyway.
jar {
    archiveVersion = ""
}

publishGithub {
    // :antigravity-provider is a subdirectory of antigravity-auth's own repo with no .git of its
    // own inside java/antigravity-provider, so publishGithub's default git-remote lookup fails.
    // Set owner/repo explicitly -- these also drive the uploaded asset name:
    // antigravity-auth-provider.jar (from `repo` + classifier), which is what ai-java's
    // GithubOrgProviderSource scanner matches. NOTE: Phase 1 only sets up this scaffold -- no tag
    // is cut and no release is published as part of this task.
    owner = "intisy-ai"
    repo = "antigravity-auth"
    releaseName = "Antigravity provider ${project.findProperty('artifact_version') ?: project.version}"
    artifacts {
        artifact {
            classifier = "provider"
            jar = file("build/libs/antigravity-provider.jar")
        }
    }
}
