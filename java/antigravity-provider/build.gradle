dependencies {
    // The pure-logic classes only need the JsonCodec/Clock/Random SPIs
    // (io.github.intisy.ai.shared.spi.*). AntigravityProvider implements the host-provided
    // Provider/ProxyHandler SPI, the same "keep the shipped jar thin" discipline stub-provider/
    // echo-provider use: compileOnly keeps :routing's classes (Provider/HandlerCtx/HttpRequest/
    // HttpResponse) out of this module's own built jar (the host's ProviderRegistry classloader
    // already has them); testImplementation re-adds it so test code can construct SPI-typed
    // references too.
    compileOnly project(":routing")
    testImplementation project(":routing")

    // core-ir's IR types only (no vendor translators): AntigravityIrBridge round-trips the
    // Anthropic<->Gemini request format through the IR. Same "keep the shipped jar thin" discipline
    // as :routing above; ai-java does not host core-ir yet, so compileOnly keeps :ir's classes out
    // of antigravity-provider.jar; testImplementation re-adds it for test code.
    compileOnly project(":ir")
    testImplementation project(":ir")

    // anthropic-translator's AnthropicTranslator, used by AntigravityGeminiSseBridge to encode the
    // outbound Anthropic-wire SSE. Same thin-jar treatment as :ir above.
    compileOnly project(":anthropic")
    testImplementation project(":anthropic")

    // gemini-translator's GeminiTranslator, used by AntigravityGeminiSseBridge/AntigravityIrBridge
    // to decode upstream Gemini responses to IR. Same thin-jar treatment as :ir above.
    compileOnly project(":gemini")
    testImplementation project(":gemini")

    // AntigravityBackend self-assembles Store/HttpClient/JsonCodec/Clock/Random + a real
    // AccountManager from the JVM backends + :accounts. CI has no composite includeBuild, so the
    // MAIN compile dependency comes from the PUBLISHED ai-java release (1.0.7) via github-gradle's
    // githubCompileOnly (-> compileOnly). Pinned to the STANDALONE fat asset (ai-java-standalone.jar,
    // classifier "standalone") because it's the one release asset that bundles jvm.backend + the
    // shared.manager/shared.model classes (AccountManager/AccountStore/OAuthConfig/Account) this
    // module needs (the plain ai-java.jar only has jvm.backend). compileOnly (not implementation)
    // keeps this module's own jar THIN: the host's ProviderRegistry classloader already has these
    // classes on its classpath. Pin the version explicitly (no floating version).
    githubCompileOnly "intisy-ai:ai-java:1.0.7:standalone"
    // AntigravityQuotaParser.accountHasQuota maps into :accounts' QuotaHealth (hasCapacity/
    // ipSuspected). The pinned 1.0.7 release above predates QuotaHealth, so this compileOnly
    // resolves ONLY through the local composite includeBuild (settings.gradle), same as the
    // testImplementation dependency below. Bumping the pinned release is a separate, gated
    // release-followup; CI's compileJava is not expected to resolve this until then.
    compileOnly "io.github.intisy:accounts:0.1.0"
    // Local dev/test only: the composite includeBuild (settings.gradle) substitutes this
    // io.github.intisy:jvm coordinate for the real :jvm project, transitively pulling in :accounts.
    // Tests are skipped in CI (-x test -x compileTestJava) so this never needs to resolve there.
    testImplementation "io.github.intisy:jvm:0.1.0"
}

// The pinned githubCompileOnly release (ai-java 1.0.7) predates the core-proxy typed-capability
// SPI + store-threading work and bundles its OWN stale HandlerCtx (no `store` field, no
// ConfigurableProvider/ModelCatalogProvider/QuotaProvider/OAuthProvider) AND a stale
// shared.manager.AccountManager (reportError still 3-arg, pre-QuotaHealth) inside its
// standalone/shaded jar; the github-gradle plugin puts that jar ahead of project(":routing")/the
// composite-substituted :accounts on the compile classpath, so without this reordering the stale
// duplicate classes win the classpath scan over the up-to-date sources this module actually wants.
// Prepend :routing's own compiled output plus a detached resolution of the composite-substituted
// :accounts (lane-aware reportError + QuotaHealth) so both resolve first for both compile tasks.
def accountsOverride = configurations.detachedConfiguration(
        dependencies.create("io.github.intisy:accounts:0.1.0"))
[compileJava, compileTestJava].each { t ->
    t.doFirst {
        t.classpath = files(project(":routing").sourceSets.main.output.classesDirs) + accountsOverride + t.classpath
    }
}

// Keep the jar filename version-less (antigravity-provider.jar) even though project.version is
// set (for publishGithub's package version): publishGithub's artifacts block below references
// build/libs/antigravity-provider.jar by that exact name, and the uploaded asset is renamed to
// antigravity-auth-provider.jar from `repo` + classifier anyway.
jar {
    archiveVersion = ""
}

publishGithub {
    // :antigravity-provider is a subdirectory of antigravity-auth's own repo with no .git of its
    // own inside java/antigravity-provider, so publishGithub's default git-remote lookup fails.
    // Set owner/repo explicitly; these also drive the uploaded asset name:
    // antigravity-auth-provider.jar (from `repo` + classifier), which is what ai-java's
    // GithubOrgProviderSource scanner matches.
    owner = "intisy-ai"
    repo = "antigravity-auth"
    releaseName = "Antigravity provider ${project.findProperty('artifact_version') ?: project.version}"
    artifacts {
        artifact {
            classifier = "provider"
            jar = file("build/libs/antigravity-provider.jar")
        }
    }
}
