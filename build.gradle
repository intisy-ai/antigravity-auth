// antigravity-auth's Java module: a self-contained Gradle build living alongside antigravity-auth's
// TS (../src, ../package.json). Does NOT reuse ai-java's root build.gradle wholesale (its
// io.github.intisy.online-gradle preset is ai-java-repo-specific), but applies the github-gradle
// publishing recipe scoped to :antigravity-provider only (the one publishable artifact in this
// multi-module build).
plugins {
    id "io.github.intisy.github-gradle" version "1.10.0" apply false
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "io.github.intisy.github-gradle"

    group = "io.github.intisy"
    // publishGithub requires a concrete version. Derive it from -Partifact_version=<tag> passed by
    // CI (stripping a leading "v"), falling back to a local dev version.
    version = (project.findProperty("artifact_version") ?: "0.0.0-dev").toString().replaceFirst(/^v/, "")

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = "https://maven.pkg.github.com/intisy-ai/ai-java"
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user")
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.token")
            }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        // 17 is which JDK COMPILES; options.release = 8 below is which JVM RUNS the output. The
        // floor is 17 because TeaVM 0.15.0's artifacts publish minimum-JVM metadata above 8.
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // All Java source, main and test alike, must stay within the JDK 1.8 API surface; javac enforces it.
    tasks.matching { it.name == "compileJava" || it.name == "compileTestJava" }.configureEach {
        options.release = 8
    }

    // Force UTF-8 source encoding for every compile task. Sources may carry non-ASCII literals
    // (e.g. the middle dot in AntigravityQuotaParser's "Gemini CLI · separate free pool"
    // group label); without this, javac falls back to the platform charset (windows-1252 on
    // Windows), misreading UTF-8 bytes and baking mojibake into the class constants (which TeaVM
    // then emits verbatim). Applies to both compileJava and compileTestJava so the JVM tests and
    // the TeaVM output agree with the source.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    }

    test {
        useJUnitPlatform()
    }

    github {
        accessToken = System.getenv("GITHUB_TOKEN") ?: ""
    }

    // Only :antigravity-provider is a published artifact (:routing/:teavm are aliased from
    // core-proxy, :antigravity-teavm is a TeaVM js-export module), so scope publishGithub so an
    // aggregate `publish` doesn't fail on the non-library modules.
    tasks.matching { it.name == "publishGithub" }.configureEach {
        onlyIf { project.path == ":antigravity-provider" }
    }
}
