import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // :antigravity-provider carries the transpilable core this export reuses verbatim. Its own
    // first-party dependencies are all compileOnly (a thin shipped jar), which does not propagate,
    // so every classifier TeaVM must see bytecode for is declared again here as implementation.
    implementation project(":antigravity-provider")
    githubImplementation "intisy-ai:basekit:4.2.0:auth-contracts"
    githubImplementation "intisy-ai:basekit:4.2.0:accounts"
    githubImplementation "intisy-ai:api:1.7.0:contract"
    // AntigravityProviderJs lives in the SAME package as :js-base (io.github.intisy.ai.js) so it
    // can reference SimpleJsonCodec unqualified, exactly like CoreProxyJs/StubProviderJs do.
    githubImplementation "intisy-ai:api:1.7.0:seam"
    githubImplementation "intisy-ai:api:1.7.0:js-base"
    githubImplementation "intisy-ai:basekit:4.2.0:routing"
    githubImplementation "intisy-ai:basekit:4.2.0:ir"
    githubImplementation "intisy-ai:gemini-translator:1.3.0:gemini"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 (sourceCompatibility/targetCompatibility +
// compileJava --release 8) for portability of :antigravity-provider. TeaVM 0.15.0's own classlib/
// jso-apis/extension-spi artifacts publish a minimum JVM-version metadata of 11-17, so
// :antigravity-teavm needs a newer compile target than :antigravity-provider, so override both the
// extension's compatibility (fixes Gradle's dependency-resolution JVM-version attribute matching)
// and the compileJava task's --release option.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
}

// Same JVM-version attribute matching problem as compileJava, now that the root block also
// pins compileTestJava to release 8: this module's test dependencies (teavm-junit, project :teavm)
// require 17.
tasks.named("compileTestJava") {
    options.release = 17
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.AntigravityProviderJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "antigravity-provider.js"
}
