name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  packages: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      extra_repository: intisy-ai/ai-java
      extra_path: ai-java-src
      gradle_test: 'test -PaiJavaDir=${{ github.workspace }}/ai-java-src'
      post_test: 'node java/antigravity-teavm/smoke/orchestrator-async-smoke.mjs'
    secrets:
      envPAT: ${{ secrets.PAT }}
