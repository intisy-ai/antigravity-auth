rootProject.name = "antigravity-auth-java"

// antigravity-auth's Java side holds the pure-logic pieces of the driver (AntigravityAuth,
// AntigravityLanes, AntigravityVersions [drift math only], AntigravityCatalog,
// AntigravityQuotaParser) as transpilable Java, needing only the JsonCodec/Clock/Random SPIs.
//
// core-proxy is a DIRECT submodule of antigravity-auth (../core-proxy from here). :routing is
// aliased the way every other provider's java/ module aliases it (project path preserved, just a
// different projectDir) so the SAME coordinates line up across the ecosystem.
include ":routing"
project(":routing").projectDir = file("../core-proxy/java/routing")

// :teavm - core-proxy's own TeaVM js-base (SimpleJsonCodec/etc), aliased like :routing
// above so :antigravity-teavm can depend on it with a plain project(":teavm") reference and reuse
// SimpleJsonCodec rather than duplicate it.
include ":teavm"
project(":teavm").projectDir = file("../core-proxy/java/teavm")

// :ir - core-ir's canonical IR types only (no vendor translators), aliased like :routing/:teavm
// above. core-ir is a DIRECT submodule of antigravity-auth (../core-ir from here), not nested
// inside another submodule.
include ":ir"
project(":ir").projectDir = file("../core-ir/java/ir")

// :gemini - the Gemini translator (GeminiTranslator etc.), from the gemini-translator submodule
// (../gemini-translator/java/gemini), a DIRECT submodule like core-ir.
include ":gemini"
project(":gemini").projectDir = file("../gemini-translator/java/gemini")

// :antigravity-provider - AntigravityAuth/AntigravityLanes/AntigravityVersions/AntigravityCatalog/
// AntigravityQuotaParser.
include ":antigravity-provider"

// :antigravity-teavm - TeaVM JS export surface over the provider classes. Reuses :teavm's js-base
// instead of duplicating it.
include ":antigravity-teavm"

// ---- test-only composite build -------------------------------------------------------------
// Pulls ai-java's own Gradle build in so :antigravity-provider can
// `compileOnly`/`testImplementation "io.github.intisy:jvm:0.1.0"`: AccountManager/AccountStore/
// OAuthConfig (:accounts) and the JVM backends (FileStore/UrlConnectionHttpClient/GsonJsonCodec/
// SystemClock/SecureRandomAdapter) that AntigravityBackend's self-assembled backend depends on.
// LOCAL DEV-ONLY: only resolves when ai-java is checked out side by side on the same machine.
// Override with -PaiJavaDir=<path> if your checkout isn't at the default.
def aiJavaDir = file(providers.gradleProperty("aiJavaDir").getOrElse("../../../java/ai-java"))
if (aiJavaDir.isDirectory()) {
    includeBuild(aiJavaDir)
} else {
    logger.warn("antigravity-auth java: ai-java not found at ${aiJavaDir} -- the includeBuild-based " +
            "io.github.intisy:jvm dependency (AntigravityBackend's self-assembled backend) will fail to " +
            "resolve. Pass -PaiJavaDir=<path-to-ai-java> to point at a different checkout.")
}
