import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // :antigravity-provider - AntigravityAuth/AntigravityLanes/AntigravityVersions/
    // AntigravityCatalog/AntigravityQuotaParser are the transpilable "core" this export reuses
    // verbatim. :antigravity-provider itself only `compileOnly`s :routing (keeping its shipped jar
    // thin), which does NOT propagate to us, so :routing is declared again below for the SPI
    // types (JsonCodec/Clock/Random) AntigravityProviderJs references directly.
    implementation project(":antigravity-provider")
    implementation project(":auth-contracts")
    implementation project(":seam")
    // :antigravity-provider only `compileOnly`s :ir/:gemini too (same thin-jar reasoning), which
    // does NOT propagate to us either, so both are declared again below so the compiled
    // orchestrator JS bundle actually contains core-ir's IR types and the GeminiTranslator that
    // the SSE/IR bridges call into.
    implementation project(":ir")
    implementation project(":gemini")
    // core-proxy's own :teavm js-base (SimpleJsonCodec), reused rather than duplicated;
    // AntigravityProviderJs lives in the SAME package (io.github.intisy.ai.js) so it can
    // reference SimpleJsonCodec unqualified, exactly like CoreProxyJs/ClaudeProviderJs do.
    implementation project(":js-base")
    // AntigravityQuotaParser.accountHasQuota calls :accounts' QuotaHealth; :antigravity-provider
    // only compileOnly's ai-java (thin-jar policy), which does not propagate here, so TeaVM needs
    // its own resolvable reference to transpile it into the JS bundle. Resolved from GitHub
    // Packages Maven (java/build.gradle's repositories block), same coordinate as
    // :antigravity-provider's own ai-java dependency.
    implementation "io.github.intisy:ai-java:1.1.0"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 (sourceCompatibility/targetCompatibility +
// compileJava --release 8) for portability of :antigravity-provider. TeaVM 0.15.0's own classlib/
// jso-apis/extension-spi artifacts publish a minimum JVM-version metadata of 11-17, so
// :antigravity-teavm needs a newer compile target than :antigravity-provider, so override both the
// extension's compatibility (fixes Gradle's dependency-resolution JVM-version attribute matching)
// and the compileJava task's --release option.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
}

// Same JVM-version attribute matching problem as compileJava, now that the root block also
// pins compileTestJava to release 8: this module's test dependencies (teavm-junit, project :teavm)
// require 17.
tasks.named("compileTestJava") {
    options.release = 17
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.AntigravityProviderJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "antigravity-provider.js"
}
